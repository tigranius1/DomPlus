{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DomPlus{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f5f7fb; }
    .navbar-brand { font-weight: 700; }
    .navbar-brand span { color: #0d6efd; }
    .apt-card { border: none; border-radius: 12px; overflow: hidden;
                box-shadow: 0 2px 12px rgba(0,0,0,.05); transition: transform .2s; }
    .apt-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,.1); }
    .apt-img { height: 180px; background: linear-gradient(135deg,#e9ecef,#dee2e6);
               display: flex; align-items: center; justify-content: center;
               color: #adb5bd; font-size: 14px; position: relative; }
    .apt-price { font-size: 20px; font-weight: 700; color: #212529; }
    .apt-title { font-size: 15px; font-weight: 600; }
    .apt-sub { font-size: 13px; color: #6c757d; }
    .apt-tag { background: #f1f3f5; padding: 4px 10px; border-radius: 6px;
               font-size: 12px; color: #495057; margin-right: 6px; }
    .fav-btn { position: absolute; top: 12px; right: 12px;
               width: 36px; height: 36px; background: white; border-radius: 50%;
               display: flex; align-items: center; justify-content: center;
               box-shadow: 0 2px 8px rgba(0,0,0,.1); cursor: pointer;
               border: none; font-size: 18px; color: #adb5bd; }
    .fav-btn.active { color: #dc3545; }
    .htmx-indicator { opacity: 0; transition: opacity .2s; }
    .htmx-request .htmx-indicator { opacity: 1; }
    .htmx-request.htmx-indicator { opacity: 1; }
    .spinner { display: inline-block; width: 1rem; height: 1rem;
               border: 2px solid rgba(0,0,0,.1); border-top-color: #0d6efd;
               border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'catalog' %}">🏢 Dom<span>Plus</span></a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
        <li class="nav-item"><a class="nav-link" href="{% url 'catalog' %}">Каталог</a></li>
        <li class="nav-item">
          <a class="nav-link position-relative" href="{% url 'favorites_list' %}">
            ⭐ Избранное
            <span id="fav-counter"
                  class="badge bg-danger position-absolute top-0 start-100 translate-middle">
              {{ favorites_count|default:0 }}
            </span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container pb-5">
  {% block content %}{% endblock %}
</main>

<!-- HTMX -->
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<!-- Alpine.js -->
<script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // CSRF для HTMX POST-запросов
  document.body.addEventListener('htmx:configRequest', (e) => {
    e.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
  });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
